apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vault-transit-unseal-operator.fullname" . }}
  labels:
    {{- include "vault-transit-unseal-operator.labels" . | nindent 4 }}
rules:
# Core resources
- apiGroups: [""]
  resources: ["pods"]
  # delete: restart a stuck transit-sealed vault pod so it re-runs auto-unseal
  # at boot (the v2.6.0 sealed-pod recovery; see pkg/reconciler UnsealVault note).
  # stored-key mode never deletes a pod — it unseals the running process — but
  # one operator serves both modes, so the verb stays.
  # watch: the Pod watch that makes unsealing event-driven rather than a poll.
  verbs: ["get", "list", "watch", "delete"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["secrets"]
  # get/list/watch also covers the stored-key unseal Secret
  # (spec.storedKey.secretRef, default vault-unseal-keys/unseal-keys.txt).
  # The operator only ever READS that one — it never creates or rewrites it;
  # `bootstrap run <cluster> vault-setup` owns its contents. The watch is what
  # makes seeding it unseal Vault immediately.
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
# Custom resources
- apiGroups: ["vault.homelab.io"]
  resources: ["vaulttransitunseals"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["vault.homelab.io"]
  resources: ["vaulttransitunseals/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["vault.homelab.io"]
  resources: ["vaulttransitunseals/finalizers"]
  verbs: ["update"]
# Events for debugging
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
# Leader election
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]